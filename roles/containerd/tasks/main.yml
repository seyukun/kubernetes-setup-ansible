- name: Docker apt
  become: true
  block:
    - name: Check Directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch ASC
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: '{{ ansible_facts["distribution_release"] }}'
        components: stable
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Update
      ansible.builtin.apt:
        update_cache: true

    - name: Install containerd
      ansible.builtin.apt:
        name:
          - containerd.io
        state: present

- name: Generate containerd config
  become: true
  block:
    - name: Check containerd directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/g'
        executable: /bin/bash
      changed_when: false
      register: containerd_config_generated

    - name: Write
      ansible.builtin.copy:
        content: "{{ containerd_config_generated.stdout }}"
        dest: /etc/containerd/config.toml
        mode: "0644"
      register: containerd_config

- name: Systemd enable now containerd
  become: true
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
  when: containerd_config.changed # noqa: no-handler
