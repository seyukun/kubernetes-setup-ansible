- name: Check already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: init_status

- name: Initialize Kubernetes master
  when: not init_status.stat.exists
  block:
    - name: Create .kube
      ansible.builtin.file:
        path: '{{ ansible_facts["env"]["HOME"] }}/.kube'
        state: directory
        mode: "0755"

    - name: Generate bootstrap token
      ansible.builtin.set_fact:
        init_kubeadm_bootstrap_token: "{{ lookup('pipe', 'openssl rand -hex 3') }}.{{ lookup('pipe', 'openssl rand -hex 8') }}"

    - name: Create init.yml
      ansible.builtin.template:
        src: init.yml.j2
        dest: '{{ ansible_facts["env"]["HOME"] }}/.kube/init.yml'
        mode: "0644"

    - name: Initialize
      become: true
      ansible.builtin.command: |
        kubeadm init --config={{ ansible_facts["env"]["HOME"] }}/.kube/init.yml
      changed_when: true
      failed_when: false
      register: init_result

    - name: Show kubeadm result
      ansible.builtin.debug:
        var: init_result.stdout_lines

    - name: Show kubeadm error
      ansible.builtin.debug:
        var: init_result.stderr_lines

- name: Copy admin.conf
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: /etc/kubernetes/admin.conf
    dest: '{{ ansible_facts["env"]["HOME"] }}/.kube/config'
    mode: "0644"
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
