- name: Kubernetes apt
  become: true
  block:
    - name: Check Directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch ASC
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Generate GPG
      become: true
      changed_when: false
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          gpg --batch --yes --dearmor -v -o - /etc/apt/keyrings/kubernetes.asc | base64 -w 0
        executable: /bin/bash
      register: kube_apt_gpg

    - name: Apply GPG
      ansible.builtin.copy:
        content: "{{ kube_apt_gpg.stdout | b64decode }}"
        dest: /etc/apt/keyrings/kubernetes.gpg
        mode: "0644"

    - name: Kubernetes apt repository
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb
        suites: /
        signed_by: /etc/apt/keyrings/kubernetes.gpg
        state: present

    - name: Update
      ansible.builtin.apt:
        update_cache: true

    - name: Install
      ansible.builtin.apt:
        name:
          - kubeadm={{ k8s_version }}.*
          - kubelet={{ k8s_version }}.*
          - kubectl={{ k8s_version }}.*
        state: present
        allow_change_held_packages: true
        allow_downgrade: true

    - name: Hold
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl
